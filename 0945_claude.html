<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

@page {
  size: A4;
  margin: 24mm 22mm 22mm 22mm;
  background: #FAF9F6;
}

body {
  font-family: 'Noto Sans CJK KR', sans-serif;
  font-size: 11.5pt;
  color: #1A1A1A;
  background: #FAF9F6;
}

/* ── 헤더 ── */
.header {
  display: flex;
  align-items: flex-end;
  gap: 16px;
  margin-bottom: 4px;
}

.num-wrap {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.problem-num {
  font-size: 54pt;
  font-weight: 300;
  line-height: 1;
  color: #1A1A1A;
  letter-spacing: -2px;
}

.level-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: #EDEBE5;
  border-radius: 20px;
  padding: 3px 10px;
  font-size: 8.5pt;
  color: #555;
  margin-bottom: 8px;
  font-weight: 500;
}
.dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #C96A3A;
  display: inline-block;
}

/* 포인트 컬러 구분선 */
.divider-wrap {
  margin: 4px 0 18px 0;
  height: 2px;
  background: linear-gradient(to right, #C96A3A 60px, #E8E5DF 60px);
}

/* ── 문제 영역 ── */
.problem-card {
  background: white;
  border-radius: 10px;
  padding: 18px 20px;
  margin-bottom: 16px;
  border: 1px solid #E8E5DF;
}

.problem-body {
  display: flex;
  gap: 16px;
  align-items: flex-start;
}

.problem-text {
  flex: 1;
  line-height: 2.05;
  font-size: 11.5pt;
  word-break: keep-all;
}

.mi { font-style: italic; }

.problem-graph {
  width: 185px;
  flex-shrink: 0;
  border-radius: 6px;
  overflow: hidden;
}
.problem-graph img { width: 100%; display: block; }

/* ── 풀이 공간 ── */
.section-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.section-bar {
  width: 3px;
  height: 14px;
  background: #C96A3A;
  border-radius: 2px;
  flex-shrink: 0;
}
.section-title {
  font-size: 10pt;
  font-weight: 700;
  color: #333;
  letter-spacing: 2px;
}

.work-lines {
  background: white;
  border-radius: 10px;
  border: 1px solid #E8E5DF;
  padding: 8px 16px;
  margin-bottom: 16px;
}
.work-line {
  border-bottom: 1px solid #ECEAE4;
  height: 34px;
}
.work-line:last-child { border-bottom: none; }

/* ── 정답란 ── */
.answer-box {
  background: white;
  border-radius: 10px;
  border: 1.5px solid #C96A3A;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.answer-label {
  font-size: 10.5pt;
  font-weight: 700;
  color: #C96A3A;
  letter-spacing: 3px;
  white-space: nowrap;
}
.answer-line {
  flex: 1;
  border-bottom: 1.5px solid #DDD;
  height: 20px;
  max-width: 280px;
}
</style>
</head>

    </div>
  </div>
</div>

<div class="divider-wrap"></div>

    <div class="problem-text">
      오른쪽 그림과 같이 이차함수<br>
      <span class="mi">f</span>(<span class="mi">x</span>) =
      <span class="mi">x</span>² + <span class="mi">kx</span> +
      <span class="mi">k</span>의 그래프의 꼭짓점을 A라 하고,
      이 그래프와 <span class="mi">y</span>축과의 교점을 B라 하자.
      직선 <span class="mi">y</span> = <span class="mi">g</span>(<span class="mi">x</span>)가
      두 점 A, B를 지날 때, 부등식<br>
      <span class="mi">f</span>(<span class="mi">x</span>) &minus;
      <span class="mi">g</span>(<span class="mi">x</span>) &lt; 0을
      만족시키는 정수 <span class="mi">x</span>가 3개가 되도록 하는
      양수 <span class="mi">k</span>의 값의 범위를 구하시오.
