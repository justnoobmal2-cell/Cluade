<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  @import url('/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc');

  * { margin:0; padding:0; box-sizing:border-box; }

  @page {
    size: A4;
    margin: 22mm 20mm 20mm 20mm;
  }

  body {
    font-family: 'Noto Sans CJK KR', 'NotoSansCJK', sans-serif;
    font-size: 12pt;
    color: #111;
    background: white;
  }

  /* ── 헤더 영역 ── */
  .header {
    display: flex;
    align-items: flex-end;
    gap: 14px;
    margin-bottom: 6px;
  }
  .problem-num {
    font-size: 52pt;
    font-weight: 200;
    line-height: 1;
    letter-spacing: -1px;
    color: #111;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 10px;
    font-size: 9pt;
    color: #555;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #555;
    display: inline-block;
  }
  .divider {
    border: none;
    border-top: 1.5px solid #222;
    margin: 0 0 16px 0;
  }

  /* ── 문제 본문 ── */
  .problem-body {
    display: flex;
    gap: 0;
    align-items: flex-start;
    margin-bottom: 18px;
  }
  .problem-text {
    flex: 1;
    font-size: 12pt;
    line-height: 2.0;
    padding-right: 10px;
    word-break: keep-all;
  }
  .math {
    font-style: italic;
  }
  .problem-graph {
    width: 195px;
    flex-shrink: 0;
  }
  .problem-graph img {
    width: 100%;
    display: block;
  }

  /* ── 풀이 공간 ── */
  .section-label {
    font-size: 10.5pt;
    font-weight: 700;
    color: #333;
    margin-bottom: 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid #bbb;
  }
  .work-area {
    margin-top: 6px;
  }
  .work-line {
    border-bottom: 1px solid #ddd;
    height: 32px;
  }

  /* ── 정답란 ── */
  .answer-box {
    margin-top: 18px;
    padding-top: 10px;
    border-top: 1.5px solid #333;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .answer-label {
    font-size: 12pt;
    font-weight: 700;
    white-space: nowrap;
  }
  .answer-line {
    flex: 1;
    border-bottom: 1px solid #444;
    height: 22px;
    max-width: 260px;
  }
</style>
</head>

</div>

  <div class="problem-text">
    오른쪽 그림과 같이 이차함수<br>
    <span class="math">f</span>(<span class="math">x</span>) = <span class="math">x</span>² + <span class="math">kx</span> + <span class="math">k</span>의 그래프의 꼭짓점을 A라 하고,
    이 그래프와 <span class="math">y</span>축과의 교점을 B라 하자.
    직선 <span class="math">y</span> = <span class="math">g</span>(<span class="math">x</span>)가 두 점 A, B를 지날 때,
    부등식 <span class="math">f</span>(<span class="math">x</span>) &minus; <span class="math">g</span>(<span class="math">x</span>) &lt; 0을 만족시키는
    정수 <span class="math">x</span>가 3개가 되도록 하는
    양수 <span class="math">k</span>의 값의 범위를 구하시오.
