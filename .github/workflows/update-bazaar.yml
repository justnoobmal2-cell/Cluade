name: Update Bazaar Data

on:
  schedule:
    - cron: '*/30 * * * *'   # 30분마다 자동 실행
  workflow_dispatch:           # 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch bazaar data from Hypixel API
        run: |
          curl -sf "https://api.hypixel.net/v2/skyblock/bazaar" \
            -H "API-Key: ${{ secrets.HYPIXEL_API_KEY }}" \
            -o docs/bazaar.json
          echo "Fetched $(wc -c < docs/bazaar.json) bytes"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/bazaar.json
          git diff --staged --quiet || git commit -m "chore: update bazaar data [skip ci]"
          git push
