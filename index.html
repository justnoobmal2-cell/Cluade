<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1014">
<title>Game</title>
<style>
  :root {
    --st: env(safe-area-inset-top, 0px); --sr: env(safe-area-inset-right, 0px);
    --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px);
    --big: min(92vmin, 720px);
  }
  html, body {
    margin: 0; width: 100%; height: 100%; background: #0d1014; overflow: hidden;
    position: fixed; inset: 0; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .panel {
    position: fixed; color: #e8ecef; background: rgba(13, 16, 20, .72);
    border: 1px solid rgba(255, 255, 255, .14); border-radius: 8px;
    font: 600 13px/1.35 ui-monospace, Menlo, Consolas, monospace; box-sizing: border-box;
  }
  button.panel { width: 40px; height: 40px; padding: 0; font-size: 20px; line-height: 1; cursor: pointer; touch-action: manipulation; }
  button.panel:active { background: rgba(60, 68, 80, .9); }
  #hud {
    top: calc(var(--st) + 8px); left: 50%; transform: translateX(-50%);
    padding: 5px 12px; text-align: center; white-space: nowrap; pointer-events: none;
  }
  #biome { font-size: 15px; }
  #coords { opacity: .75; font-weight: 400; }
  #mini {
    top: calc(var(--st) + 8px); right: calc(var(--sr) + 8px);
    width: min(30vmin, 168px); height: min(30vmin, 168px);
    image-rendering: pixelated; cursor: pointer; touch-action: none; z-index: 2;
  }
  #mini.big {
    top: 50%; left: 50%; right: auto; transform: translate(-50%, -50%);
    width: var(--big); height: var(--big); cursor: grab;
    box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .6);
  }
  #mapbar {
    display: none; position: fixed; z-index: 3; gap: 6px;
    top: calc(50% - var(--big) / 2 + 10px); right: calc(50% - var(--big) / 2 + 10px);
  }
  body.mapopen #mapbar { display: flex; }
  #mapbar button { position: static; }
  #full { left: calc(var(--sl) + 8px); top: calc(var(--st) + 8px); }
  #inv { left: calc(var(--sl) + 8px); top: calc(var(--st) + 56px); padding: 6px 10px; pointer-events: none; }
  #inv b { color: #ffd400; margin-left: 4px; }
  #techbtn { left: calc(var(--sl) + 8px); top: calc(var(--st) + 98px); width: auto; padding: 0 14px; font-size: 14px; }

  #tech {
    display: none; position: fixed; inset: 0; z-index: 10; flex-direction: column;
    background: rgba(13, 16, 20, .95); color: #e8ecef;
    font: 14px/1.4 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    padding: var(--st) var(--sr) var(--sb) var(--sl);
  }
  #tech.open { display: flex; }
  #tech header { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.14); }
  #tech header h1 { margin: 0; font-size: 17px; flex: 1; }
  #tech header button { position: static; }
  #techscroll { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; }
  #techtree { position: relative; }
  #techtree svg { position: absolute; left: 0; top: 0; }
  #techtree path { fill: none; stroke: rgba(255,255,255,.22); stroke-width: 2; }
  #techtree path.on { stroke: #6aa84f; }
  .node {
    position: absolute; width: 124px; height: 52px; box-sizing: border-box; padding: 4px 8px;
    display: flex; flex-direction: column; justify-content: center; text-align: left;
    background: #1b212b; color: inherit; font: inherit; cursor: pointer;
    border: 2px solid rgba(255,255,255,.35); border-radius: 8px;
  }
  .node b { font-size: 14px; }
  .node span { font-size: 11px; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node.locked { opacity: .45; border-style: dashed; }
  .node.ready { border-color: #ffd400; }
  .node.done { border-color: #6aa84f; background: #1f3322; }
  .node.sel { box-shadow: 0 0 0 3px rgba(255,255,255,.55); }
  #techinfo {
    display: flex; align-items: center; gap: 12px; min-height: 84px; box-sizing: border-box;
    padding: 10px 12px; border-top: 1px solid rgba(255,255,255,.14); background: #141920;
  }
  #techinfo div { flex: 1; }
  #techinfo p { margin: 2px 0 0; font-size: 13px; opacity: .8; }
  #research {
    padding: 10px 16px; font: inherit; font-weight: 700; color: #14181d; background: #ffd400;
    border: 0; border-radius: 8px; cursor: pointer; white-space: nowrap;
  }
  #research:disabled { background: #4a4f58; color: #9aa0a9; cursor: default; }
  #zin  { right: calc(var(--sr) + 8px); bottom: calc(var(--sb) + 60px); }
  #zout { right: calc(var(--sr) + 8px); bottom: calc(var(--sb) + 12px); }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud" class="panel"><div id="biome"></div><div id="coords"></div></div>
<canvas id="mini" class="panel" width="400" height="400"></canvas>
<div id="mapbar">
  <button id="mapin" class="panel" aria-label="지도 확대">+</button>
  <button id="mapout" class="panel" aria-label="지도 축소">−</button>
  <button id="mapclose" class="panel" aria-label="지도 닫기">×</button>
</div>
<button id="full" class="panel" aria-label="전체 화면">⛶</button>
<div id="inv" class="panel">막대기<b id="stickCount">0</b></div>
<button id="techbtn" class="panel">테크</button>
<div id="tech">
  <header><h1>테크트리</h1><button id="techclose" class="panel" aria-label="닫기">×</button></header>
  <div id="techscroll"><div id="techtree"></div></div>
  <div id="techinfo"></div>
</div>
<button id="zin" class="panel" aria-label="확대">+</button>
<button id="zout" class="panel" aria-label="축소">−</button>
<script src="main.js"></script>
</body>
</html>
