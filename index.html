<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1014">
<title>Game</title>
<style>
  html, body {
    margin: 0; width: 100%; height: 100%; background: #0d1014; overflow: hidden;
    position: fixed; inset: 0; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .panel {
    position: fixed; color: #e8ecef; background: rgba(13, 16, 20, .72);
    border: 1px solid rgba(255, 255, 255, .14); border-radius: 8px;
    font: 600 13px/1.35 ui-monospace, Menlo, Consolas, monospace;
  }
  #hud {
    top: calc(env(safe-area-inset-top, 0px) + 8px); left: 50%; transform: translateX(-50%);
    padding: 5px 12px; text-align: center; white-space: nowrap; pointer-events: none;
  }
  #biome { font-size: 15px; }
  #coords { opacity: .75; font-weight: 400; }
  #mini {
    top: calc(env(safe-area-inset-top, 0px) + 8px); right: calc(env(safe-area-inset-right, 0px) + 8px);
    width: min(30vmin, 168px); height: min(30vmin, 168px);
    image-rendering: pixelated; pointer-events: none;
  }
  #full {
    left: calc(env(safe-area-inset-left, 0px) + 8px); top: calc(env(safe-area-inset-top, 0px) + 8px);
    width: 36px; height: 36px; padding: 0; font-size: 18px; cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud" class="panel"><div id="biome"></div><div id="coords"></div></div>
<canvas id="mini" class="panel" width="200" height="200"></canvas>
<button id="full" class="panel" aria-label="전체 화면">⛶</button>
<script src="main.js"></script>
</body>
</html>
